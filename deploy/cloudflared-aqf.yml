# Regola da aggiungere al tunnel Cloudflare già esistente, che raggiunge il
# Raspberry col suo IP in rete interna. Se il tunnel si gestisce dalla
# dashboard (Zero Trust → Networks → Tunnels → Public Hostname) basta un nuovo
# hostname con servizio HTTP e URL  IP-del-Raspberry:8790 . Se invece usa un
# config.yml, va messa PRIMA della regola finale «- service: http_status:404».
#
# Prima crea il record DNS (sostituisci nome del tunnel e dominio):
#   cloudflared tunnel route dns <NOME_TUNNEL> lezioni.esempio.it
# Poi riavvia cloudflared dove gira.

ingress:
  - hostname: lezioni.esempio.it
    # IP del Raspberry in rete interna (lo stampa installa.sh; oppure: hostname -I)
    service: http://192.168.1.50:8790
    originRequest:
      connectTimeout: 30s
      # Il caricamento di un PowerPoint grande può durare un po'.
      keepAliveTimeout: 90s

  - service: http_status:404

# Note
# - Il microfono funziona solo in HTTPS: dall'indirizzo del tunnel sì, da
#   http://IP-del-Raspberry:8790 no (il resto della piattaforma sì).
# - Non aggiungere regole «Cache Everything» su questo hostname: le risposte
#   /api/* contengono dati personali. /assets/* ha l'impronta nel nome e si può
#   tenere in cache.
# - Se vuoi un secondo lucchetto, una policy di Cloudflare Access sull'hostname
#   si somma al login della piattaforma.
